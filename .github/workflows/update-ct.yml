name: Update Hero Dirt CT

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hero-dirt-ct
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-actions.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-actions.txt

      - name: Show Python environment
        run: |
          python --version
          pip list

      - name: Update MRMS
        run: |
          python src/get_mrms.py

      - name: Configure Earthdata credentials
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          cat > ~/.netrc <<EOF
          machine urs.earthdata.nasa.gov
            login $EARTHDATA_USERNAME
            password $EARTHDATA_PASSWORD
          EOF

          chmod 600 ~/.netrc

      - name: Update SMAP
        run: |
          python src/get_smap.py

      - name: Update NWS forecast
        run: |
          python src/get_nws.py

      - name: Run Hero Dirt v2
        run: |
          python src/run_soil_model_v2.py

      - name: Build trail forecast
        run: |
          python src/build_trail_map.py

      - name: Build Explorer
        run: |
          python src/build_explorer_map.py

      - name: Prepare Pages site
        run: |
          mkdir -p site/data

          cp web/HeroDirt_trails.html site/index.html
          cp web/HeroDirt_explorer.html site/HeroDirt_explorer.html

          cp web/data/*.geojson site/data/

          touch site/.nojekyll

          echo
          echo "Generated site:"
          du -sh site
          find site -maxdepth 2 -type f -print

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
