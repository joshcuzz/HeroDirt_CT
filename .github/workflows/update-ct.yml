name: Update Hero Dirt CT

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hero-dirt-ct
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-actions.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-actions.txt

      - name: Show Python environment
        run: |
          python --version
          pip list

      - name: Check Supabase rider feedback database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PYCODE'
          import os
          import urllib.request
          import urllib.error

          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SECRET_KEY"]

          endpoint = (
              url
              + "/rest/v1/trail_reports"
              + "?select=observation_utc"
              + "&order=observation_utc.desc"
              + "&limit=1"
          )

          req = urllib.request.Request(
              endpoint,
              headers={
                  "apikey": key,
                  "User-Agent": "HeroDirt-CT-healthcheck/1.0",
              },
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read().decode()
                  print("Supabase status:", r.status)
                  print("Latest report query:", body)

          except urllib.error.HTTPError as e:
              print("Supabase HTTP error:", e.code)
              print(e.read().decode())
              raise

          except Exception as e:
              print("Supabase connection failed:", repr(e))
              raise
          PYCODE

      - name: Update MRMS
        run: |
          python src/get_mrms.py

      - name: Configure Earthdata credentials
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          cat > ~/.netrc <<EOF
          machine urs.earthdata.nasa.gov
            login $EARTHDATA_USERNAME
            password $EARTHDATA_PASSWORD
          EOF

          chmod 600 ~/.netrc

      - name: Update SMAP
        run: |
          for attempt in 1 2 3; do
            echo "SMAP attempt $attempt/3"

            if python src/get_smap.py; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "SMAP failed; waiting 60 seconds before retry..."
              sleep 60
            fi
          done

          echo "SMAP failed after 3 attempts."
          exit 1

      - name: Update NWS forecast
        run: |
          python src/get_nws.py

      - name: Run Hero Dirt v2
        run: |
          python src/run_soil_model_v2.py

      - name: Restore OSM trail caches
        run: |
          mkdir -p data/osm

          gunzip -c             data/osm/Connecticut_all_trails_overpass.json.gz             > data/osm/Connecticut_all_trails_overpass.json

          gunzip -c             data/osm/Connecticut_trail_areas_overpass.json.gz             > data/osm/Connecticut_trail_areas_overpass.json

      - name: Build trail forecast
        run: |
          python src/build_trail_map.py

      - name: Build Explorer
        run: |
          python src/build_explorer_map.py

      - name: Prepare Pages site
        run: |
          mkdir -p site/data

          cp web/HeroDirt_trails.html site/index.html
          cp web/HeroDirt_explorer.html site/HeroDirt_explorer.html

          cp web/data/*.geojson site/data/

          touch site/.nojekyll

          echo
          echo "Generated site:"
          du -sh site
          find site -maxdepth 2 -type f -print

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
